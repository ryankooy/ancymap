[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancy"
version = "0.1.0"
requires-python = ">=3.10"
authors = [
    { name = "Ryan K", email = "lugubriderm@gmail.com" }
]

[project.scripts]
ancy = "api.__main__:main"

[tool.black]
line-length = 88
target-version = ['py310']
